name: ci

on:
  push:
    branches: [main]
    tags: [final]
  pull_request:
  workflow_dispatch:
    inputs:
      model_tag:
        description: "GitHub Release tag of the model to evaluate (model-v1, model-v2) or 'untrained' for the base Pythia-70M"
        default: model-v1

env:
  MODEL_TAG: ${{ github.event.inputs.model_tag || 'model-v1' }}
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose --report-path gitleaks-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gitleaks-report, path: gitleaks-report.json}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff==0.8.4
      - run: ruff check .

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v tests

  evaluate:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Download model from GitHub Release
        run: |
          mkdir -p model
          if [ "$MODEL_TAG" = "untrained" ]; then
            echo "Deliberately bad model: untrained EleutherAI/pythia-70m"
            python -c "from transformers import AutoModelForCausalLM as M, AutoTokenizer as T; M.from_pretrained('EleutherAI/pythia-70m').save_pretrained('model'); T.from_pretrained('EleutherAI/pythia-70m').save_pretrained('model')"
          else
            gh release download "$MODEL_TAG" --repo "$GITHUB_REPOSITORY" --dir model
            (cd model && sha256sum -c model.sha256)
          fi
          ls -la model
      - name: Predict on validation.jsonl
        run: python training/predict.py --model model --out ci_predictions.jsonl
      - name: Score
        run: python tools/score.py ci_predictions.jsonl data/validation.jsonl --out ci_score.json
      - uses: actions/upload-artifact@v4
        with: {name: evaluation, path: "ci_predictions.jsonl\nci_score.json"}

  quality-gate:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: evaluation}
      - name: score.py --min-validity 95
        run: python tools/score.py ci_predictions.jsonl data/validation.jsonl --min-validity 95
