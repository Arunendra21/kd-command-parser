apiVersion: apps/v1
kind: Deployment
metadata: {name: kd-service, namespace: app, labels: {app: kd-service}}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector: {matchLabels: {app: kd-service}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata: {labels: {app: kd-service}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kd-service
          image: kd-service:1.0
          imagePullPolicy: Never
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: MODEL_URI, value: "s3://models/v1"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs-s3.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - {name: FAULT_INJECT, value: "0"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 2
            failureThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              # keep serving while the endpoint is removed from the Service/Ingress
              exec: {command: ["python", "-c", "import time; time.sleep(8)"]}
