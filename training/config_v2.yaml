# v2 = v1 settings plus one more epoch. Used for the rolling-update test (Task 4).
version: v2
base_model: EleutherAI/pythia-70m
base_model_revision: main
seed: 42
learning_rate: 3.0e-4
batch_size: 16
epochs: 11
max_seq_length: 128
warmup_ratio: 0.05
weight_decay: 0.0
train_records: 1500            # first 1,500 records of the cleaned dataset (assignment cap)
data_path: results/datasets/v1/train.jsonl
data_sha256_path: results/datasets/v1/train.sha256
output_dir: artifacts/v2
loss_csv: training/loss_v2.csv
library_versions:
  python: "3.11"
  torch: "2.4.1+cpu"
  transformers: "4.46.3"
  tokenizers: "0.20.3"
  safetensors: "0.4.5"
  pyyaml: "6.0.3"
